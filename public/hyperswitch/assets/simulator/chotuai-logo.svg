<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 168 40" role="img" aria-label="ChotuAI">
  <title>ChotuAI</title>
  <!-- The mark: six rounded petals around a small centre, a sprout of an idea -->
  <g transform="translate(20 20)" fill="#E8673C">
    <ellipse rx="4.2" ry="8.6" transform="translate(0 -8.4)"/>
    <ellipse rx="4.2" ry="8.6" transform="rotate(60) translate(0 -8.4)"/>
    <ellipse rx="4.2" ry="8.6" transform="rotate(120) translate(0 -8.4)"/>
    <ellipse rx="4.2" ry="8.6" transform="rotate(180) translate(0 -8.4)"/>
    <ellipse rx="4.2" ry="8.6" transform="rotate(240) translate(0 -8.4)"/>
    <ellipse rx="4.2" ry="8.6" transform="rotate(300) translate(0 -8.4)"/>
    <circle r="3.4" fill="#FFF7F2"/>
  </g>
  <text x="44" y="27.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#1F2430">chotu<tspan fill="#E8673C">AI</tspan></text>
</svg>
