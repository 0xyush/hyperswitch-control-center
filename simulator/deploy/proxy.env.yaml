# Non-secret settings for the Cloud Run proxy (gcloud run deploy --env-vars-file).
# Secrets are NOT here: they come from Secret Manager (see README.md).
# Ids only; none of these values is a credential.
#
# 27 Oct 2026: the proxy talks to our self-hosted Hyperswitch v2 on VM revrec-hs (simulator/selfhost),
# over the VPC: Cloud Run uses Direct VPC egress (network default, subnet default) and reaches the
# router on the VM's private address. The shared sandbox values are in git history (before 27 Oct).
HS_BASE_URL: "http://10.128.0.2:8080"
HS_ENGINE: "selfhost"
HS_PROFILE_ID: "pro_ERRABdriTTf2P9zQAaOo"
HS_BILLING_MCA_ID: "mca_GqpomlVeLy0KWzhMj0Bh"
HS_PAYMENT_MCA_ID: "mca_ykauzpQVd2YIqqd5qYNk"
HS_REVREC_MERCHANT_ID: "revrec_sim_UI1B0CLGpcQUbVoFuZmc"
HS_MERCHANT_ID: "revrec_sim_UI1B0CLGpcQUbVoFuZmc"
HS_ORG_ID: "org_l6DAJCc3YH0hY8KC0quv"
HS_RECOVERY_PATH: "v2/recovery"
# Same origin: the proxy serves the dashboard, so no other origin is allowed.
ALLOWED_ORIGINS: ""
RATE_LIMIT_STARTS_PER_HOUR: "30"
RATE_LIMIT_PORTFOLIO_PER_HOUR: "6"
SIM_PORTFOLIO: "1"
# The engine retries every 5 s, so the timings and the portfolio stop-after choices are in seconds.
SIM_FAST_ENGINE: "1"
# 1 real day = about 14 s on the sim service's simulated calendar, so 7 min covers the 30-day grace
PORTFOLIO_STOP_AFTER_MINUTES: "1,3,7"
# Invoices per portfolio run (the form's slider goes up to this)
PORTFOLIO_MAX_INVOICES: "25"
# The portfolio pair (selfhost/seed.sh): the static side on the default profile (cascading), the
# smart side on the smart profile (Rev Rec's model).
HS_STATIC_PROFILE_ID: "pro_ERRABdriTTf2P9zQAaOo"
HS_STATIC_PAYMENT_MCA_ID: "mca_ykauzpQVd2YIqqd5qYNk"
HS_STATIC_BILLING_MCA_ID: "mca_GqpomlVeLy0KWzhMj0Bh"
HS_SMART_PROFILE_ID: "pro_n8eOPyJSb9CTERVzP2zx"
HS_SMART_PAYMENT_MCA_ID: "mca_woXIrr2S7jSj4KfqXmKa"
HS_SMART_BILLING_MCA_ID: "mca_kARak7ModeYQL2BudoXM"
# The webhook inbox on the VM (simulator/selfhost/inbox), over the VPC: the rule default-allow-internal
# (10.128.0.0/9, all ports) lets Cloud Run reach port 8092. Its read token is the secret
# revrec-sim-inbox-read-token (put-secrets.sh, from .env.vm).
INBOX_URL: "http://10.128.0.2:8092"
# The sim service on the VM (simulator/selfhost/sim), also over the VPC. Its token is the secret
# revrec-sim-sim-token (put-secrets.sh, from .env.vm).
SIM_URL: "http://10.128.0.2:8093"
# Preset 9 runs on the decider profile (smart, model flag off; selfhost/seed.sh 6c). The stand-in
# decider's call log is on the VM's port 8094, also covered by default-allow-internal.
HS_DECIDER_PROFILE_ID: "pro_GEvDg8d0NcIbNzsILlih"
HS_DECIDER_BILLING_MCA_ID: "mca_B27dy5Pwu7liMw90xJuo"
HS_DECIDER_PAYMENT_MCA_ID: "mca_DoH1FHu4Yj9EclZP7LBX"
DECIDER_URL: "http://10.128.0.2:8094"
# Live settings: the profiles a story leases (selfhost/seed.sh 8d; profile:billing:payment ids), and
# smart on them (the sim service's calendar covers model-arm invoices).
HS_POOL: "pro_JvbIzRLm1XeGcNSwpKo8:mca_EfEDaZWeZmeshYGnJOAR:mca_TIIPTAJFJTEXQk59Vsnq,pro_WgAfqiQqFWPmhgPKqas2:mca_2TcAXpEVLaPUuhIcvYf8:mca_yTzUpXRWrzEozFNnebqB,pro_Q777ifUUzoB6b3d0RaMJ:mca_J5j9I0kPaqaIZ3Cy6w2K:mca_4e6eSzl4lMA07rCOzTrp,pro_skUKm5E6c07OGM0NbnFq:mca_fydCsIn6FiZ2jGWGSrh6:mca_kYxLO61UauRr3fWQaxha,pro_yD3pfzFrADF49Oa7dPx2:mca_2Ek7bqVrmt5Qccht28uS:mca_bU4hs1E1TKPc9u8f9jVH,pro_8k5luHdf0BrzNDrbDrbp:mca_9xYxyADAzAv8jS74sUkr:mca_njFc3xnjfDxZkU078bDP"
