# Non-secret settings for the Cloud Run proxy (gcloud run deploy --env-vars-file).
# Secrets are NOT here: they come from Secret Manager (see README.md).
# Ids only; none of these values is a credential.
#
# 27 Oct 2026: the proxy talks to our self-hosted Hyperswitch v2 on VM revrec-hs (simulator/selfhost),
# over the VPC: Cloud Run uses Direct VPC egress (network default, subnet default) and reaches the
# router on the VM's private address. The shared sandbox values are in git history (before 27 Oct).
HS_BASE_URL: "http://10.128.0.2:8080"
HS_ENGINE: "selfhost"
HS_PROFILE_ID: "pro_ERRABdriTTf2P9zQAaOo"
HS_BILLING_MCA_ID: "mca_GqpomlVeLy0KWzhMj0Bh"
HS_PAYMENT_MCA_ID: "mca_ykauzpQVd2YIqqd5qYNk"
HS_REVREC_MERCHANT_ID: "revrec_sim_UI1B0CLGpcQUbVoFuZmc"
HS_MERCHANT_ID: "revrec_sim_UI1B0CLGpcQUbVoFuZmc"
HS_ORG_ID: "org_l6DAJCc3YH0hY8KC0quv"
HS_RECOVERY_PATH: "v2/recovery"
# Same origin: the proxy serves the dashboard, so no other origin is allowed.
ALLOWED_ORIGINS: ""
RATE_LIMIT_STARTS_PER_HOUR: "30"
RATE_LIMIT_PORTFOLIO_PER_HOUR: "6"
SIM_PORTFOLIO: "1"
# The engine retries every 5 s, so the timings and the portfolio stop-after choices are in seconds.
SIM_FAST_ENGINE: "1"
PORTFOLIO_STOP_AFTER_MINUTES: "0.5,1,2"
# The portfolio pair (HS_STATIC_* / HS_SMART_*) is not seeded on the engine: both runs use the profile above.
