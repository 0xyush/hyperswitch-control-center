# Self-hosted Hyperswitch v2 for the Rev Rec simulator, on one VM (simulator/selfhost/README.md).
# Services: Postgres, Redis, prepare + migrate (one-shot), router (v2), scheduler producer and
# consumer, a stand-in decider, and seed (run by hand: docker compose --profile seed run --rm seed).
# The router listens on 127.0.0.1:8080 only. The proxy reaches it through an SSH tunnel.
# Secrets and image names come from .env (copy .env.example).
name: revrec-hs

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

# The router and both schedulers read the same config file and secrets.
x-hs-env: &hs-env
  ROUTER__SECRETS__ADMIN_API_KEY: ${HS_ADMIN_API_KEY:?set HS_ADMIN_API_KEY in .env}
  ROUTER__SECRETS__JWT_SECRET: ${HS_JWT_SECRET:?set HS_JWT_SECRET in .env}
  ROUTER__SECRETS__MASTER_ENC_KEY: ${HS_MASTER_ENC_KEY:?set HS_MASTER_ENC_KEY in .env}
  ROUTER__API_KEYS__HASH_KEY: ${HS_API_KEY_HASH_KEY:?set HS_API_KEY_HASH_KEY in .env}
  ROUTER__MASTER_DATABASE__PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  ROUTER__REPLICA_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
  ROUTER__ACCOUNTS_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
  ROUTER__GLOBAL_DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
  ROUTER__ANALYTICS__SQLX__PASSWORD: ${POSTGRES_PASSWORD}

x-hs-volumes: &hs-volumes
  - ./config.toml:/local/config/selfhost.toml:ro
  - hs_src:/local/src:ro

services:
  pg:
    image: docker.io/postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hyperswitch_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hyperswitch_db -U db_user"]
      interval: 5s
      retries: 20

  # The config file names this host.
  redis-standalone:
    image: docker.io/redis:7
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep '^PONG$'"]
      interval: 5s
      retries: 20

  # Fetches the migrations and the Superposition seed for HS_TAG, and takes the ladder keys out of
  # the seed (prepare.sh).
  prepare:
    image: docker.io/alpine:3.20
    logging: *logging
    environment:
      HS_TAG: ${HS_TAG:?set HS_TAG in .env}
    volumes:
      - ./prepare.sh:/prepare.sh:ro
      - hs_src:/src
    command: ["sh", "/prepare.sh"]

  migrate:
    image: docker.io/debian:trixie-slim
    logging: *logging
    depends_on:
      pg:
        condition: service_healthy
      prepare:
        condition: service_completed_successfully
    environment:
      # The password goes in PGPASSWORD (libpq), because diesel prints the URL when it fails.
      DATABASE_URL: postgresql://db_user@pg:5432/hyperswitch_db
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEBIAN_FRONTEND: noninteractive
    volumes:
      - ./migrate.sh:/migrate.sh:ro
      - hs_src:/src:ro
    command: ["bash", "/migrate.sh"]

  router:
    image: ${HS_ROUTER_IMAGE:?set HS_ROUTER_IMAGE in .env}
    restart: unless-stopped
    logging: *logging
    command: /local/bin/router -f /local/config/selfhost.toml
    environment: *hs-env
    volumes: *hs-volumes
    ports:
      - "127.0.0.1:8080:8080"
      # The VM's private address, so Cloud Run reaches the router over the VPC (Direct VPC egress).
      # Not reachable from the internet: the firewall allows 8080 only from inside the VPC.
      # Unset = 127.0.0.2, a second loopback address, so nothing extra is exposed.
      - "${HS_PRIVATE_IP:-127.0.0.2}:8080:8080"
    depends_on:
      redis-standalone:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: curl --fail http://localhost:8080/v2/health || exit 1
      interval: 5s
      retries: 30
      start_period: 10s

  producer:
    image: ${HS_SCHEDULER_IMAGE:?set HS_SCHEDULER_IMAGE in .env}
    restart: unless-stopped
    logging: *logging
    command: /local/bin/scheduler -f /local/config/selfhost.toml
    environment:
      <<: *hs-env
      SCHEDULER_FLOW: producer
    volumes: *hs-volumes
    depends_on:
      router:
        condition: service_healthy

  consumer:
    image: ${HS_SCHEDULER_IMAGE:?set HS_SCHEDULER_IMAGE in .env}
    restart: unless-stopped
    logging: *logging
    command: /local/bin/scheduler -f /local/config/selfhost.toml
    environment:
      <<: *hs-env
      SCHEDULER_FLOW: consumer
    volumes: *hs-volumes
    depends_on:
      router:
        condition: service_healthy

  # Stand-in for Rev Rec's retry-time decider (decider/decider.mjs), a narrow test double: every call
  # gets "retry in DECIDER_RETRY_AFTER_SEC seconds" and threshold 0.5. The engine still picks the card.
  # config.toml [grpc_client.recovery_decider_client] sends the router and both schedulers to
  # decider:50051, on the compose network only. Only a smart profile without the model flag calls it
  # (sim-smart-decider, seed.sh 6c). The proxy reads its call log on 8094 (locally through the tunnel,
  # -L 8094:127.0.0.1:8094; on Cloud Run on HS_PRIVATE_IP).
  decider:
    image: docker.io/node:24-alpine
    restart: unless-stopped
    logging: *logging
    command: ["node", "/decider/decider.mjs"]
    environment:
      DECIDER_GRPC_PORT: "50051"
      DECIDER_HTTP_PORT: "8094"
      DECIDER_RETRY_AFTER_SEC: ${DECIDER_RETRY_AFTER_SEC:-5}
      DECIDER_THRESHOLD: "0.5"
      DECIDER_STORE: /data/decider.json
    volumes:
      - ./decider:/decider:ro
      - decider_data:/data
    ports:
      - "127.0.0.1:8094:8094"
      - "${HS_PRIVATE_IP:-127.0.0.2}:8094:8094"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8094/health || exit 1"]
      interval: 10s
      retries: 5

  # Receives the engine's outgoing webhooks, as a billing system would (inbox/inbox.mjs); the proxy
  # reads them back. The engine refuses webhook URLs on private addresses (its SSRF guard), so it
  # posts to the VM's external IP (HS_WEBHOOK_URL), which GCP delivers to the private NIC; the
  # firewall allows 8092 only from the VM's own external IP. Reads need INBOX_READ_TOKEN.
  # Started on its own: docker compose --profile webhooks up -d webhook-inbox
  webhook-inbox:
    image: docker.io/node:24-alpine
    profiles: ["webhooks"]
    restart: unless-stopped
    logging: *logging
    command: ["node", "/inbox/inbox.mjs"]
    environment:
      INBOX_PORT: "8092"
      INBOX_HASH_KEY: ${HS_WEBHOOK_HASH_KEY:-}
      INBOX_READ_TOKEN: ${INBOX_READ_TOKEN:-}
      INBOX_STORE: /data/inbox.json
    volumes:
      - ./inbox:/inbox:ro
      - inbox_data:/data
    ports:
      - "127.0.0.1:8092:8092"
      - "${HS_PRIVATE_IP:-127.0.0.2}:8092:8092"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health || exit 1"]
      interval: 10s
      retries: 5

  # Simulated calendar, learning re-file and the bank for Rev Rec's model (sim/sim.mjs, MODEL.md). It
  # moves the smart profile's model-planned retries to their demo time, keeps the retry stats at the
  # seed plus each outcome at its real-life slot, and decides Rev Rec's charges for invoices the proxy
  # marks (the engine's Stripe calls pass through it). The proxy reads it on 8093 (locally through the tunnel,
  # -L 8093:127.0.0.1:8093; on Cloud Run on HS_PRIVATE_IP). Needs SIM_TOKEN.
  # Started on its own: docker compose --profile sim up -d --build sim
  sim:
    build: ./sim
    profiles: ["sim"]
    restart: unless-stopped
    logging: *logging
    environment:
      SIM_PORT: "8093"
      SIM_TOKEN: ${SIM_TOKEN:-}
      SIM_SECONDS_PER_DAY: ${SIM_SECONDS_PER_DAY:-}
      SIM_REFILE: ${SIM_REFILE:-on}
      # The bank on 8095 (compose network only; config.toml stripe.base_url). off: pass-through only
      SIM_BANK: ${SIM_BANK:-on}
      STRIPE_TEST_KEY: ${STRIPE_TEST_KEY:-}
      # Processors whose bank stories are proven (GET /bank/processors; the proxy offers the
      # real-world stories only there). All six go through the bank (config.toml <id>.base_url =
      # http://sim:8095/<id>/...). Cybersource's keys sign its requests again
      SIM_BANK_PROCESSORS: ${SIM_BANK_PROCESSORS:-adyen,authorizedotnet,nmi,worldpay,globalpay,cybersource}
      CYBERSOURCE_API_KEY: ${CYBERSOURCE_API_KEY:-}
      CYBERSOURCE_API_SECRET: ${CYBERSOURCE_API_SECRET:-}
      HS_BASE_URL: http://router:8080
      HS_ADMIN_API_KEY: ${HS_ADMIN_API_KEY:?set HS_ADMIN_API_KEY in .env}
      PGHOST: pg
      PGUSER: db_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: hyperswitch_db
    volumes:
      - ./model:/model:ro
      - ./state:/state:ro
      - sim_data:/data
    ports:
      - "127.0.0.1:8093:8093"
      - "${HS_PRIVATE_IP:-127.0.0.2}:8093:8093"
    depends_on:
      router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health || exit 1"]
      interval: 10s
      retries: 5

  # docker compose --profile seed run --rm seed. Writes state/seed.env and state/proxy.env.
  seed:
    image: docker.io/alpine:3.20
    profiles: ["seed"]
    logging: *logging
    environment:
      HS_BASE_URL: http://router:8080
      HS_ADMIN_API_KEY: ${HS_ADMIN_API_KEY:?set HS_ADMIN_API_KEY in .env}
      HS_JWT_SECRET: ${HS_JWT_SECRET:?set HS_JWT_SECRET in .env}
      STRIPE_TEST_KEY: ${STRIPE_TEST_KEY:?set STRIPE_TEST_KEY in .env}
      RETRY_MODE: ${RETRY_MODE:-cascading}
      LADDER_JSON: ${LADDER_JSON:-}
      HS_WEBHOOK_URL: ${HS_WEBHOOK_URL:-}
      HS_WEBHOOK_HASH_KEY: ${HS_WEBHOOK_HASH_KEY:-}
      INBOX_READ_TOKEN: ${INBOX_READ_TOKEN:-}
      STATE_DIR: /state
    volumes:
      - ./seed.sh:/seed.sh:ro
      - ./state:/state
      # The seeded retry stats for Rev Rec's model (MODEL.md, seed.sh 8c)
      - ./model:/model:ro
    depends_on:
      router:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache bash curl jq openssl >/dev/null && bash /seed.sh",
      ]

volumes:
  pg_data:
  hs_src:
  decider_data:
  inbox_data:
  sim_data:
